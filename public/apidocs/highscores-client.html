<!-- Note: Moved to Glitch -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>High Scores</title>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

<h2>High Scores</h2>

<table id="highScoresTable">
  <thead>
    <tr>
      <th>Name</th>
      <th>Score</th>
    </tr>
  </thead>
  <tbody>
    <!-- High scores will be dynamically added here -->
  </tbody>
</table>

<script>
  console.log('hi')
  async function fetchHighScores() {
    try {
      const response = await fetch('https://highscores-api.glitch.me/highscores');
      const highScores = await response.json();
      return highScores;
    } catch (error) {
      console.error('Error fetching high scores:', error);
      return [];
    }
  }

  async function displayHighScores() {
    const highScores = await fetchHighScores();
    const tableBody = document.querySelector('#highScoresTable tbody');
    tableBody.innerHTML = ''; // Clear existing table rows
    highScores.forEach(score => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${score.name}</td>
        <td>${score.score}</td>
      `;
      tableBody.appendChild(row);
    });
  }

  // Call the function to display high scores when the page loads
  displayHighScores();
</script>

</body>
</html>
